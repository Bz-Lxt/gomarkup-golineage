name: golineage

services:
  # ---------------------------------------------------------------- #
  # PostgreSQL 17 —— 事件日志（唯一权威数据源）与快照检查点存储
  # ---------------------------------------------------------------- #
  db:
    image: postgres:17-alpine
    container_name: golineage-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_USER: golineage
      POSTGRES_PASSWORD: golineage_dev_pwd
      POSTGRES_DB: golineage
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "27432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golineage -d golineage"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - golineage-net

  # ---------------------------------------------------------------- #
  # Go 后端 —— 手写内存图引擎 + 事件溯源 API
  # ---------------------------------------------------------------- #
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: golineage-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      HTTP_ADDR: ":8080"
      DB_DSN: "postgres://golineage:golineage_dev_pwd@db:5432/golineage?sslmode=disable"
      LOG_LEVEL: "info"
      # 首次启动且事件日志为空时，自动写入两套演示场景种子数据
      SEED_ON_EMPTY: "true"
      SEED_SCENARIO: "both"
      # CORS 白名单（前端经 Nginx 同源反代，此处仅为直连调试保留）
      CORS_ALLOW_ORIGINS: "http://localhost:27430,http://127.0.0.1:27430"
      # 图算法安全上限（防止超宽查询拖垮服务）
      GRAPH_MAX_DEPTH: "10"
      GRAPH_MAX_PATHS: "1000"
      GRAPH_MAX_NODES: "20000"
      GRAPH_QUERY_TIMEOUT: "10s"
      # 每累计 N 条事件落一次全量快照检查点
      SNAPSHOT_INTERVAL: "500"
    ports:
      - "27431:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - golineage-net

  # ---------------------------------------------------------------- #
  # Vue 3 前端 —— 镜像内多阶段构建，Nginx 托管并反代 /api
  # ---------------------------------------------------------------- #
  web:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: golineage-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      - "27430:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - golineage-net

networks:
  golineage-net:
    driver: bridge

volumes:
  pgdata:
